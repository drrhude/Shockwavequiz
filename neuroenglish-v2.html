<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta property="og:description" content="Take the free 90-second NeuroPath nerve check and get your personal nerve-health score.">

<style>
:root{
  --olive:#6B6E57;        /* logo olive */
  --olive-dk:#4F5340;
  --sage:#8A9A7E;
  --sage-pale:#EEF1E9;
  --sage-mist:#F5F7F2;
  --line:#DDE3D6;
  --ink:#141A16;          /* green-black */
  --ink-2:#2E3A32;
  --muted:#66736A;
  --gold:#B8965A;
  --gold-pale:#F6EEDF;
  --white:#FFFFFF;
  --warn:#9C5B3B;
  --warn-pale:#F4E6DD;
  --radius:18px;
  --shadow:0 1px 2px rgba(20,26,22,.04),0 8px 28px rgba(20,26,22,.07);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'DM Sans',system-ui,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(900px 500px at 85% -10%, rgba(138,154,126,.22), transparent 60%),
    radial-gradient(700px 400px at -10% 30%, rgba(184,150,90,.08), transparent 60%),
    var(--sage-mist);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.serif{font-family:'DM Serif Display',Georgia,serif;font-weight:400}

/* ---------- Header ---------- */
.hdr{
  position:sticky;top:0;z-index:50;
  background:rgba(255,255,255,.82);
  backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--line);
}
.hdr-in{max-width:640px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand img{height:34px;width:auto;display:block}
.brand-txt{line-height:1.1}
.brand-txt b{display:block;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--olive-dk)}
.brand-txt span{font-size:11px;color:var(--muted);letter-spacing:.04em}
.hdr-call{
  display:inline-flex;align-items:center;gap:7px;
  font-size:13.5px;font-weight:600;color:var(--ink);text-decoration:none;
  padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--white);
  white-space:nowrap;
}
.hdr-call svg{width:15px;height:15px;color:var(--olive)}

/* ---------- Progress ---------- */
.prog{max-width:640px;margin:0 auto;padding:16px 18px 0;display:none}
.prog.on{display:block}
.prog-meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:8px;font-weight:500}
.prog-bar{height:6px;background:var(--line);border-radius:999px;overflow:hidden}
.prog-fill{height:100%;width:0;background:linear-gradient(90deg,var(--olive),var(--sage));border-radius:999px;transition:width .45s cubic-bezier(.2,.8,.2,1)}

/* ---------- Layout ---------- */
.wrap{max-width:640px;margin:0 auto;padding:18px 16px 120px}
.screen{display:none;animation:rise .4s cubic-bezier(.2,.8,.2,1)}
.screen.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{
  position:relative;overflow:hidden;
  background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:28px 22px;
}
.wm{position:absolute;right:-40px;bottom:-50px;width:230px;opacity:.06;pointer-events:none;user-select:none}

/* ---------- Hero ---------- */
.hero{text-align:center;padding:34px 22px 28px}
.hero-logo{width:132px;height:auto;margin:0 auto 22px;display:block}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--olive-dk);
  background:var(--sage-pale);padding:7px 12px;border-radius:999px;margin-bottom:16px;
}
.eyebrow i{width:6px;height:6px;border-radius:50%;background:var(--gold);display:inline-block}
.hero h1{font-size:clamp(30px,7.4vw,42px);line-height:1.08;letter-spacing:-.01em;margin-bottom:14px}
.hero h1 em{font-style:italic;color:var(--olive)}
.hero p.lead{font-size:16px;color:var(--ink-2);max-width:42ch;margin:0 auto 20px}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:24px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--ink-2);background:var(--sage-mist);border:1px solid var(--line);padding:7px 11px;border-radius:999px}
.chip svg{width:14px;height:14px;color:var(--olive)}
.trust{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-top:18px;font-size:12.5px;color:var(--muted)}
.trust span{display:inline-flex;align-items:center;gap:6px}
.trust svg{width:14px;height:14px;color:var(--gold)}

/* ---------- Buttons ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
  background:var(--ink);color:var(--white);
  font-size:16.5px;font-weight:600;letter-spacing:.01em;
  padding:17px 22px;border-radius:14px;text-decoration:none;
  box-shadow:0 6px 18px rgba(20,26,22,.18);
  transition:transform .12s ease, box-shadow .2s ease, opacity .2s ease, background .2s ease;
}
.btn:hover{background:#1f2822}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.35;box-shadow:none;pointer-events:none}
.btn .arr{transition:transform .2s ease}
.btn:hover .arr{transform:translateX(3px)}
.btn.gold{background:var(--gold);color:var(--ink);box-shadow:0 6px 18px rgba(184,150,90,.35)}
.btn.gold:hover{background:#c5a46a}
.btn.ghost{background:var(--white);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.back{margin-top:14px;font-size:14px;color:var(--muted);padding:6px 2px;display:inline-flex;align-items:center;gap:6px}
.back[hidden]{display:none}

/* ---------- Questions ---------- */
.q-step{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.q-title{font-size:clamp(23px,5.6vw,28px);line-height:1.18;margin-bottom:6px}
.q-hint{font-size:14px;color:var(--muted);margin-bottom:18px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.opt{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:var(--white);border:1.5px solid var(--line);border-radius:14px;
  padding:15px 16px;min-height:58px;
  transition:border-color .15s ease, background .15s ease, transform .1s ease;
}
.opt:hover{border-color:var(--sage)}
.opt:active{transform:scale(.99)}
.opt:focus-visible{outline:3px solid rgba(107,110,87,.35);outline-offset:2px}
.opt .ic{flex:none;width:38px;height:38px;border-radius:11px;background:var(--sage-pale);display:grid;place-items:center;color:var(--olive)}
.opt .ic svg{width:19px;height:19px}
.opt .tx{flex:1;min-width:0}
.opt .tx b{display:block;font-size:15.5px;font-weight:600;color:var(--ink)}
.opt .tx small{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.opt .ck{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;transition:all .15s ease}
.opt.multi .ck{border-radius:7px}
.opt .ck svg{width:13px;height:13px;color:var(--white);opacity:0;transform:scale(.6);transition:all .15s ease}
.opt[aria-pressed="true"]{border-color:var(--olive);background:var(--sage-mist)}
.opt[aria-pressed="true"] .ck{background:var(--olive);border-color:var(--olive)}
.opt[aria-pressed="true"] .ck svg{opacity:1;transform:none}
.q-foot{margin-top:18px}

/* ---------- Analyzing ---------- */
.anl{text-align:center;padding:44px 24px}
.spin{width:64px;height:64px;margin:0 auto 22px;position:relative}
.spin img{width:30px;position:absolute;inset:0;margin:auto;opacity:.9}
.spin svg{width:64px;height:64px;animation:rot 1.1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.anl h2{font-size:26px;margin-bottom:18px}
.anl ul{list-style:none;display:inline-flex;flex-direction:column;gap:10px;text-align:left}
.anl li{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--muted);opacity:.35;transition:opacity .3s ease,color .3s ease}
.anl li.done{opacity:1;color:var(--ink)}
.anl li .dot{width:20px;height:20px;border-radius:50%;background:var(--line);display:grid;place-items:center;transition:background .3s}
.anl li.done .dot{background:var(--olive)}
.anl li .dot svg{width:11px;height:11px;color:#fff}

/* ---------- Gate ---------- */
.tease{
  display:flex;align-items:center;gap:16px;
  background:var(--sage-mist);border:1px dashed var(--line);border-radius:14px;padding:14px 16px;margin:18px 0 20px;
}
.tease .ring-sm{flex:none;width:58px;height:58px;filter:blur(3.5px)}
.tease b{display:block;font-size:14.5px}
.tease span{font-size:13px;color:var(--muted)}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inp{
  width:100%;font:inherit;font-size:16px;color:var(--ink);
  background:var(--white);border:1.5px solid var(--line);border-radius:12px;padding:14px 14px;
  transition:border-color .15s ease, box-shadow .15s ease;
}
.inp:focus{outline:none;border-color:var(--olive);box-shadow:0 0 0 4px rgba(107,110,87,.14)}
.inp.err{border-color:var(--warn)}
.form-err{display:none;font-size:13.5px;color:var(--warn);margin:4px 0 10px}
.form-err.on{display:block}
.fine{font-size:11.5px;color:var(--muted);margin-top:12px;line-height:1.5}
.lock{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;color:var(--muted);margin-top:12px}
.lock svg{width:13px;height:13px}

/* ---------- Results ---------- */
.res-top{text-align:center;padding:30px 22px 26px}
.ring{width:150px;height:150px;margin:0 auto 14px;position:relative}
.ring svg{width:150px;height:150px;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:var(--sage-pale);stroke-width:12}
.ring .val{fill:none;stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-family:'DM Serif Display',serif;font-weight:400;font-size:42px;line-height:1}
.ring .num span{font-size:9.5px;letter-spacing:.1em;max-width:96px;text-align:center;line-height:1.2;text-transform:uppercase;color:var(--muted);margin-top:4px}
.tier{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:7px 13px;border-radius:999px;margin-bottom:14px}
.tier.low{background:var(--sage-pale);color:var(--olive-dk)}
.tier.mod{background:var(--gold-pale);color:#7A5E2E}
.tier.high{background:var(--warn-pale);color:var(--warn)}
.res-top h2{font-size:clamp(25px,6vw,31px);line-height:1.15;margin-bottom:10px}
.res-top p{font-size:15.5px;color:var(--ink-2);max-width:46ch;margin:0 auto}
.sec{margin-top:14px}
.sec h3{font-size:21px;margin-bottom:14px}
.find{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.find:first-of-type{border-top:0;padding-top:0}
.find .fi{flex:none;width:30px;height:30px;border-radius:9px;background:var(--sage-pale);color:var(--olive);display:grid;place-items:center}
.find .fi svg{width:16px;height:16px}
.find b{display:block;font-size:15px;margin-bottom:2px}
.find p{font-size:14px;color:var(--muted)}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:14px}
.step{display:flex;gap:14px}
.step::before{counter-increment:s;content:counter(s);flex:none;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center}
.step b{display:block;font-size:15px}
.step p{font-size:14px;color:var(--muted)}
.book{background:var(--ink);color:#fff;border-color:var(--ink);padding:26px 18px 18px}
.book .wm{opacity:.08}
.book h3{color:#fff;font-size:24px;margin-bottom:6px}
.book p.sub{color:#C9D2C4;font-size:14.5px;margin-bottom:16px}
.book .perks{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.book .perks span{font-size:12.5px;color:#E6EBE2;border:1px solid rgba(255,255,255,.16);padding:6px 10px;border-radius:999px}
.cal{background:#fff;border-radius:14px;overflow:hidden;min-height:640px}
.cal iframe{width:100%;height:760px;border:0;display:block}
.alt{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px}
.alt .btn{font-size:15.5px;padding:15px 18px}
.doc{display:flex;gap:16px;align-items:center}
.doc img{flex:none;width:64px;height:auto;opacity:.95}
.doc b{display:block;font-size:16px}
.doc p{font-size:14px;color:var(--muted)}
.disc{font-size:12px;color:var(--muted);text-align:center;margin:20px 6px 0;line-height:1.55}
.restart{display:block;margin:12px auto 0;font-size:13px;color:var(--muted);text-decoration:underline}

/* ---------- Sticky mobile CTA ---------- */
.sticky{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  display:none;gap:10px;
  transform:translateY(110%);transition:transform .35s ease;
}
.sticky.on{display:flex}
.sticky.show{transform:none}
.sticky .btn{padding:14px 16px;font-size:15px}
.sticky .call{flex:none;width:52px;padding:0;background:var(--white);border:1.5px solid var(--line);color:var(--ink);box-shadow:none}
.sticky .call svg{width:20px;height:20px}

.foot{text-align:center;font-size:12px;color:var(--muted);padding:26px 16px 10px}
.foot a{color:var(--muted)}

@media (min-width:560px){
  .card{padding:34px 34px}
  .hero{padding:44px 40px 34px}
  .alt{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>

      <h2 class="serif" id="rHead"></h2>
      <p id="rBody"></p>
    </div>

      <h3 class="serif" id="t-find-h"></h3>
      <div id="rFind"></div>
    </div>

      <img class="wm" src="cvc-mark-cream.png" alt="">

function updateProg(){
  const total = Q.length;
  $('prog').classList.add('on');
  $('progLabel').textContent = C.s.qOf(idx+1,total);
  const left = Math.max(1, Math.ceil((total-idx)*7/60));
  $('progLeft').textContent = C.s.left(left, total-idx);
  $('progFill').style.width = ((idx)/total*100)+'%';
}

/* ============ QUESTIONS ============ */
function renderQ(){
  const q = Q[idx];
  updateProg();
  $('qStep').textContent = q.cat;
  $('qTitle').textContent = q.text;
  $('qHint').textContent = q.multi ? C.s.multiHint : (q.hint||'');
  $('qHint').style.display = (q.multi || q.hint) ? '' : 'none';
  const sel = ans[q.key] || [];
  $('qOpts').innerHTML = q.options.map((o,i)=>`
    <button type="button" class="opt${q.multi?' multi':''}" data-i="${i}" aria-pressed="${sel.includes(i)}">
      <span class="ic">${ICON[o.icon||'dots']}</span>
      <span class="tx"><b>${o.label}</b>${o.sub?`<small>${o.sub}</small>`:''}</span>
      <span class="ck">${ICON.check}</span>
    </button>`).join('');
  $('qOpts').querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>pick(+b.dataset.i)));
  $('qFoot').innerHTML = q.multi ? `<button class="btn" id="contBtn" ${sel.length?'':'disabled'}>${C.s.cont}<span class="arr">→</span></button>` : '';
  if(q.multi) $('contBtn').addEventListener('click', next);
  $('backBtn').hidden = false;
}
function pick(i){
  const q = Q[idx];
  let sel = ans[q.key] ? [...ans[q.key]] : [];
  if(q.multi){
    const isNone = !!q.options[i].none;
    if(sel.includes(i)) sel = sel.filter(x=>x!==i);
    else if(isNone) sel = [i];
    else sel = sel.filter(x=>!q.options[x].none).concat(i);
    ans[q.key] = sel;
    $('qOpts').querySelectorAll('.opt').forEach(b=>b.setAttribute('aria-pressed', sel.includes(+b.dataset.i)));
    $('contBtn').disabled = !sel.length;
  } else {
    ans[q.key] = [i];
    $('qOpts').querySelectorAll('.opt').forEach(b=>b.setAttribute('aria-pressed', +b.dataset.i===i));
    setTimeout(next, 260);
  }
}
function next(){
  if(idx < Q.length-1){ idx++; renderQ(); window.scrollTo({top:0,behavior:'smooth'}); }
  else analyze();
}
function back(){
  if(idx>0){ idx--; renderQ(); }
  else { $('prog').classList.remove('on'); show('s-hero'); }
}

/* ============ SCORING ============ */
function score(){
  let pts=0, max=0;
  Q.forEach(q=>{
    const sel = ans[q.key]||[];
    if(q.multi){
      const cap = q.cap || q.options.length;
      pts += Math.min(cap, sel.reduce((a,i)=>a+(q.options[i].score||0),0));
      max += cap;
    } else {
      pts += sel.length ? q.options[sel[0]].score : 0;
      max += Math.max(...q.options.map(o=>o.score));
    }
  });
  return Math.round(pts/max*100);
}
function tierFor(pct){ return pct>=60 ? 'high' : pct>=34 ? 'mod' : 'low'; }
function labels(key){ const q=Q.find(x=>x.key===key); return (ans[key]||[]).map(i=>q.options[i].label); }
function has(key, val){ const q=Q.find(x=>x.key===key); return (ans[key]||[]).some(i=>q.options[i].v===val); }
function val(key){ const q=Q.find(x=>x.key===key); const s=ans[key]||[]; return s.length? q.options[s[0]].v : null; }

/* ============ ANALYZE ============ */
function analyze(){
  $('progFill').style.width='100%';
  show('s-anl');
  const items = $('anlList').querySelectorAll('li');
  items.forEach((li,i)=>setTimeout(()=>li.classList.add('done'), 450+i*520));
  setTimeout(()=>{ $('prog').classList.remove('on'); show('s-gate'); setTimeout(()=>$('fFirst').focus({preventScroll:true}),350); }, 450+items.length*520+250);
}

/* ============ FORM ============ */
const phoneEl = $('fPhone');
phoneEl.addEventListener('input', e=>{
  let d = e.target.value.replace(/\D/g,'');
  if(d.length===11 && d[0]==='1') d = d.slice(1);
  d = d.slice(0,10);
  let out = d;
  if(d.length>6) out = `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`;
  else if(d.length>3) out = `(${d.slice(0,3)}) ${d.slice(3)}`;
  else if(d.length) out = `(${d}`;
  e.target.value = out;
});

$('leadForm').addEventListener('submit', e=>{
  e.preventDefault();
  const first=$('fFirst').value.trim(), last=$('fLast').value.trim();
  const phone=$('fPhone').value.replace(/\D/g,''), email=$('fEmail').value.trim();
  const bad = [];
  if(!first) bad.push('fFirst');
  if(phone.length!==10) bad.push('fPhone');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) bad.push('fEmail');
  ['fFirst','fPhone','fEmail'].forEach(id=>$(id).classList.toggle('err', bad.includes(id)));
  if(bad.length){ $('formErr').textContent = C.s.formErr; $('formErr').classList.add('on'); $(bad[0]).focus(); return; }
  $('formErr').classList.remove('on');

  const pct = score(), tier = tierFor(pct);
  const btn = $('submitBtn'); btn.disabled = true; btn.firstElementChild.textContent = C.s.sending;

  const payload = {
    name: (first+' '+last).trim(),
    first_name:first, last_name:last, phone, email,
    source: C.source, language: C.lang,
    quiz_score_pct: pct,
    lead_type: C.tiers[tier].lead,
    symptoms: labels('symptoms').join(', '),
    location: labels('location').join(', '),
    frequency: labels('frequency').join(''),
    duration: labels('duration').join(''),
    night_symptoms: labels('night').join(''),
    balance: labels('balance').join(''),
    risk_factors: labels('risk').join(', '),
    medication: labels('meds').join(''),
    activity_impact: labels('impact').join(''),
    utm_source: params.get('utm_source')||'', utm_medium: params.get('utm_medium')||'',
    utm_campaign: params.get('utm_campaign')||'', utm_content: params.get('utm_content')||'',
    fbclid: params.get('fbclid')||'',
    page_url: location.href.split('?')[0]
  };

  fetch(C.webhook, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)})
    .catch(err=>console.warn('Webhook:', err))
    .finally(()=>showResults(pct, tier, first));
});

/* ============ RESULTS ============ */
function showResults(pct, tier, first){
  const t = C.tiers[tier];
  const color = tier==='high' ? '#9C5B3B' : tier==='mod' ? '#B8965A' : '#6B6E57';
  $('rTier').className = 'tier '+tier; $('rTier').textContent = t.label;
  $('rHead').textContent = t.head(first);
  $('rBody').textContent = t.body;
  const ring = $('ringVal'), C2 = 2*Math.PI*62;
  ring.style.stroke = color; ring.style.strokeDasharray = C2; ring.style.strokeDashoffset = C2;

  const f = C.findings({labels, has, val, pct, tier}).slice(0,4);
  $('rFind').innerHTML = f.map(x=>`<div class="find"><span class="fi">${ICON[x[0]]}</span><div><b>${x[1]}</b><p>${x[2]}</p></div></div>`).join('');

  if(!$('calFrame').src) $('calFrame').src = CAL_URL;
  show('s-res');
  // count-up + ring
  setTimeout(()=>{
    ring.style.strokeDashoffset = C2*(1-pct/100);
    const t0 = performance.now();
    (function tick(now){ const p=Math.min(1,(now-t0)/1400); $('rPct').textContent = Math.round(pct*(1-Math.pow(1-p,3)))+'%'; if(p<1) requestAnimationFrame(tick); })(t0);
  }, 300);
  $('sticky').classList.add('on');
  requestAnimationFrame(()=>requestAnimationFrame(()=>$('sticky').classList.add('show')));
}

// hide sticky bar while the booking card is on screen
const io = new IntersectionObserver(es=>es.forEach(e=>$('sticky').classList.toggle('show', !e.isIntersecting && $('s-res').classList.contains('on'))), {threshold:.15});
io.observe($('bookCard'));
$('stickyBook').addEventListener('click', ()=>$('bookCard').scrollIntoView({behavior:'smooth', block:'start'}));

/* ============ BOOT ============ */
fillStatic();
$('startBtn').addEventListener('click', ()=>{ idx=0; show('s-q'); renderQ(); });
$('backBtn').addEventListener('click', back);
$('restartBtn').addEventListener('click', ()=>{
  Object.keys(ans).forEach(k=>delete ans[k]); idx=0;
  $('leadForm').reset(); $('submitBtn').disabled=false; $('submitBtn').firstElementChild.textContent=C.s.submit;
  $('sticky').classList.remove('on','show'); show('s-hero');
});
</script>
